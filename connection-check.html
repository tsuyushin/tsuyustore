<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>手账连接检查</title><style>body{background:#f5f1e8;color:#39362e;font:18px system-ui;margin:30px auto;padding:24px;max-width:480px}button,input{font:inherit;padding:12px;margin:8px 0;max-width:100%;box-sizing:border-box}button{background:#e3d6ba;border:1px solid #8c7f68;border-radius:6px}pre{white-space:pre-wrap;line-height:1.6}label{display:block}</style><h1>手账连接检查</h1><p>无需注册任何账号。</p><button id="check">检查连接</button><label>手账密码 <input id="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off"></label><button id="login">检查密码登录</button><pre id="result" role="status">请点击“检查连接”。</pre><script>
const base='https://wepcukczqgugdvnkfxfr.supabase.co/functions/v1/travel-api/api/';
const result=document.getElementById('result');
async function run(login){result.textContent='正在检查…';try{const r=await fetch(base+(login?'access':'health'),{method:login?'POST':'GET',headers:login?{'Content-Type':'application/json'}:{},...(login?{body:JSON.stringify({code:document.getElementById('pin').value,member:'B'})}:{}),credentials:'omit',signal:AbortSignal.timeout(15000)});const d=await r.json();if(!r.ok)throw Error(d.error||('HTTP '+r.status));if(login){const check=await fetch(base+'trip',{headers:{Authorization:'Bearer '+d.token},credentials:'omit',signal:AbortSignal.timeout(15000)});if(!check.ok)throw Error('登录成功，但数据读取失败：'+check.status);result.textContent='成功：Donna 密码登录、私人数据读取均正常。'}else result.textContent='成功：当前网络可以连接新同步服务。'}catch(e){result.textContent='连接未通过：'+e.message+'\n请把这段结果告诉 Zoe。'}}
document.getElementById('check').onclick=()=>run(false);document.getElementById('login').onclick=()=>run(true);
</script></html>
